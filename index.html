  <title>Beer Pong World Cup 2026</title>
  <style>
    :root {
      --ink: #071b28;
      --ink-soft: #0d2a35;
      --ivory: #f7f0df;
      --ivory-dim: #d9d1bf;
      --gold: #e4b85d;
      --gold-bright: #ffd984;
      --coral: #f45b47;
      --green: #17483d;
      --line: rgba(242, 211, 145, .57);
      --card: rgba(7, 23, 32, .88);
      --muted: rgba(247, 240, 223, .55);
      --header-h: clamp(92px, 13.4vh, 146px);
      --footer-h: clamp(38px, 5.2vh, 58px);
      --round-gap: clamp(20px, 2.2vw, 46px);
      --card-h: clamp(72px, 9vh, 96px);
      --radius: 3px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
    }

    body {
      color: var(--ivory);
      font-family: "Avenir Next Condensed", "Franklin Gothic Condensed", "Trebuchet MS", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .stage {
      position: relative;
      isolation: isolate;
      width: 100vw;
      height: 100vh;
      min-height: 620px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(3, 18, 28, .18), rgba(3, 18, 28, .6)),
        radial-gradient(circle at 50% 0%, rgba(22, 75, 79, .18), transparent 55%),
        var(--ink);
    }

        linear-gradient(90deg, rgba(2, 15, 24, .6), transparent 14%, transparent 86%, rgba(2, 15, 24, .6)),
        linear-gradient(180deg, rgba(2, 15, 24, .28) 0%, rgba(2, 15, 24, .48) 58%, rgba(2, 15, 24, .82) 100%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 4px);
      mix-blend-mode: normal;
    }

    .masthead {
      position: relative;
      z-index: 3;
      height: var(--header-h);
      display: grid;
      grid-template-columns: minmax(150px, 1fr) auto minmax(150px, 1fr);
      align-items: center;
      gap: 28px;
      padding: clamp(18px, 2.7vh, 30px) clamp(28px, 3.8vw, 76px) 12px;
    }

    .masthead::after {
      content: "";
      position: absolute;
      left: 3.8vw;
      right: 3.8vw;

    .event-mark {

      align-items: center;
      gap: 12px;
      animation: rise-in .7s .15s both;

    .cup-mark {

      width: 40px;
      height: 48px;
      flex: 0 0 auto;
    }

    .cup-mark::before,
    .cup-mark::after {
      content: "";
      position: absolute;
      border: 2px solid var(--gold);
    }

    .cup-mark::before {
      left: 9px;
      top: 4px;
      width: 18px;
      height: 24px;
      border-radius: 2px 2px 11px 11px;
      background: linear-gradient(145deg, rgba(255, 217, 132, .2), transparent);
    }

    .cup-mark::after {
      left: 13px;
      bottom: 4px;
      width: 12px;
      height: 3px;
      border-width: 2px 0;
      box-shadow: 6px -11px 0 -5px var(--gold);
    }

    .mark-copy { line-height: 1; }

    .mark-kicker {
      display: block;
      margin-bottom: 5px;
      color: var(--gold-bright);
      font-size: clamp(9px, .74vw, 13px);
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .mark-place {
      display: block;
      color: var(--ivory-dim);
      font-size: clamp(11px, .88vw, 15px);
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .title-lockup {
      text-align: center;
      animation: rise-in .75s both;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      margin: 0 0 2px;
      color: var(--gold-bright);
      font-size: clamp(9px, .76vw, 13px);
      font-weight: 800;
      letter-spacing: .34em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--gold);
    }

    h1 {
      margin: 0;
      font-family: "Rockwell Extra Bold", Rockwell, "Roboto Slab", Georgia, serif;
      font-size: clamp(30px, 3.05vw, 59px);
      font-weight: 900;
      line-height: .96;
      letter-spacing: -.045em;
      text-transform: uppercase;
      text-shadow: 0 5px 30px rgba(0,0,0,.34);
    }

    h1 em {
      color: var(--coral);
      font-style: normal;
    }

    .live-chip {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px 8px;
      border: 1px solid rgba(228, 184, 93, .45);
      background: rgba(6, 25, 34, .62);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.025);
      color: var(--ivory-dim);
      font-size: clamp(9px, .7vw, 12px);
      font-weight: 800;
      letter-spacing: .19em;
      text-transform: uppercase;
      animation: rise-in .7s .15s both;
    }

    .broadcast-controls {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 9px;
      animation: rise-in .7s .15s both;
    }

    .fullscreen-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 37px;
      padding: 8px 12px 7px;
      border: 1px solid rgba(228, 184, 93, .66);
      border-radius: 0;
      background: linear-gradient(135deg, rgba(228, 184, 93, .18), rgba(6, 25, 34, .78));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.025), 0 6px 22px rgba(0,0,0,.18);
      color: var(--gold-bright);
      cursor: pointer;
      font: inherit;
      font-size: clamp(9px, .7vw, 12px);
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
      transition: color .2s ease, border-color .2s ease, background .2s ease, transform .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .fullscreen-button:hover {
      border-color: var(--gold-bright);
      background: linear-gradient(135deg, rgba(228, 184, 93, .3), rgba(6, 25, 34, .88));
      color: #fff8e8;
      transform: translateY(-1px);
    }

    .fullscreen-button:active { transform: translateY(1px); }

    .fullscreen-button:focus-visible {
      outline: 2px solid var(--coral);
      outline-offset: 3px;
    }

    .fullscreen-button[disabled] {
      cursor: not-allowed;
      opacity: .42;
      transform: none;
    }

    .fullscreen-icon {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-linecap: square;
      stroke-linejoin: miter;
      stroke-width: 1.7;
    }

    .fullscreen-icon .contract { display: none; }
    .fullscreen-button[data-active="true"] .expand { display: none; }
    .fullscreen-button[data-active="true"] .contract { display: inline; }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 0 0 0 4px rgba(244, 91, 71, .13), 0 0 14px rgba(244, 91, 71, .75);
      animation: pulse 2.2s infinite;

    .bracket-shell {
      position: relative;
      z-index: 2;
      height: calc(100vh - var(--header-h) - var(--footer-h));
      min-height: 470px;
      padding: 12px clamp(27px, 3.5vw, 70px) 10px;
    }

    .bracket {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1.05fr 1.08fr .98fr .96fr .88fr;
      column-gap: var(--round-gap);
    }

    .connector-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .connector-shadow,
    .connector {
      fill: none;
      stroke-linecap: square;
      stroke-linejoin: miter;
      vector-effect: non-scaling-stroke;
    }

    .connector-shadow {
      stroke: rgba(0, 0, 0, .5);
      stroke-width: 4;
    }

    .connector {
      stroke: var(--line);
      stroke-width: 1.5;
    }

    .round {
      position: relative;
      z-index: 1;
      height: 100%;
      min-width: 0;
      animation: fade-across .7s both;
    }

    .round:nth-of-type(2) { animation-delay: .12s; }
    .round:nth-of-type(3) { animation-delay: .2s; }
    .round:nth-of-type(4) { animation-delay: .28s; }
    .round:nth-of-type(5) { animation-delay: .36s; }
    .round:nth-of-type(6) { animation-delay: .44s; }

    .round-heading {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      min-height: 23px;
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(247, 240, 223, .16);
      color: var(--ivory);
      font-size: clamp(10px, .72vw, 13px);
      font-weight: 900;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .round-heading small {
      color: var(--gold);
      font-size: .75em;
      font-weight: 800;
      letter-spacing: .14em;
    }

    .match {
      position: absolute;
      left: 0;
      width: 100%;
      height: var(--card-h);
      transform: translateY(-50%);
      border: 1px solid rgba(247, 240, 223, .22);
      border-left: 3px solid var(--gold);
      border-radius: var(--radius);
      background:
        linear-gradient(110deg, rgba(255,255,255,.035), transparent 45%),
        var(--card);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .2), inset 0 1px rgba(255,255,255,.035);
      backdrop-filter: blur(8px);
      overflow: hidden;
    }

    .match::before {
      content: attr(data-code);
      position: absolute;
      top: 50%;
      right: 7px;
      transform: translateY(-50%);
      color: rgba(247, 240, 223, .035);
      font-family: Rockwell, Georgia, serif;
      font-size: 38px;
      font-weight: 900;
      line-height: 1;
    }

    .match.completed {
      border-color: rgba(228, 184, 93, .58);
      border-left-color: var(--coral);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .23), inset 0 0 28px rgba(228, 184, 93, .045);
    }

    .match.completed .team { padding-right: clamp(43px, 3vw, 56px); }

    .match-status {
      position: absolute;
      z-index: 3;
      top: 50%;
      right: 7px;
      transform: translateY(-50%);
      padding: 4px 5px 3px 7px;
      border: 1px solid rgba(255, 255, 255, .16);
      background: var(--coral);
      box-shadow: 0 3px 12px rgba(0,0,0,.24);
      color: #fff8e8;
      font-size: clamp(6px, .47vw, 9px);
      font-weight: 900;
      letter-spacing: .15em;
      line-height: 1;
      text-transform: uppercase;
    }

    .team {
      position: relative;
      z-index: 1;
      height: 50%;
      display: grid;
      grid-template-columns: clamp(25px, 1.65vw, 34px) minmax(0, 1fr) 14px;
      align-items: center;
      gap: clamp(6px, .55vw, 10px);
      padding: 0 clamp(7px, .7vw, 12px);
      color: var(--ivory);
      transition: opacity .25s ease, background .25s ease;
    }

    .team + .team { border-top: 1px solid rgba(247, 240, 223, .13); }

    .seed {
      display: grid;
      place-items: center;
      width: clamp(23px, 1.5vw, 30px);
      height: clamp(23px, 1.5vw, 30px);
      border: 1px solid rgba(228, 184, 93, .52);
      border-radius: 50%;
      background: rgba(228, 184, 93, .08);
      color: var(--gold-bright);
      font-family: Rockwell, Georgia, serif;
      font-size: clamp(10px, .75vw, 14px);
      font-weight: 900;
    }

    .team-name {
      min-width: 0;
      overflow: hidden;
      font-size: clamp(11px, .92vw, 17px);
      font-weight: 800;
      letter-spacing: .02em;
      line-height: 1.05;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team.placeholder .team-name {
      color: var(--muted);
      font-size: clamp(9px, .7vw, 12px);
      font-style: italic;
      font-weight: 600;
      letter-spacing: .05em;
    }

    .team.placeholder .seed {
      border-style: dashed;
      color: var(--muted);
    }

    .team.winner {
      background: linear-gradient(90deg, rgba(228, 184, 93, .18), transparent 85%);
    }

    .team.winner .team-name { color: #fff8e8; }

    .team.winner .advance {
      opacity: 1;
      color: var(--gold-bright);
    }

    .team.eliminated { opacity: .35; }

    .advance {
      justify-self: end;
      opacity: .18;
      color: var(--ivory);
      font-size: 12px;
    }

    .champion-card {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      transform: translateY(-50%);
      padding: clamp(18px, 2.6vh, 28px) clamp(12px, 1.2vw, 22px);
      border: 1px solid rgba(255, 217, 132, .66);
      background:
        radial-gradient(circle at 50% -10%, rgba(255, 217, 132, .24), transparent 50%),
        linear-gradient(145deg, rgba(24, 72, 61, .96), rgba(5, 26, 31, .96));
      box-shadow: 0 0 0 4px rgba(228, 184, 93, .07), 0 20px 60px rgba(0,0,0,.34);
      text-align: center;
      overflow: hidden;
    }

    .champion-card::before,
    .champion-card::after {
      content: "";
      position: absolute;
      width: 80px;
      height: 80px;
      border: 1px solid rgba(255, 217, 132, .17);
      transform: rotate(45deg);
    }

    .champion-card::before { left: -58px; top: -36px; }
    .champion-card::after { right: -58px; bottom: -36px; }

    .crown {
      display: block;
      margin: 0 auto 12px;
      color: var(--gold-bright);
      font-size: clamp(25px, 2vw, 40px);
      line-height: 1;
      text-shadow: 0 0 22px rgba(255, 217, 132, .35);
    }

    .champion-label {
      display: block;
      margin-bottom: 8px;
      color: var(--gold-bright);
      font-size: clamp(8px, .62vw, 11px);
      font-weight: 900;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .champion-name {
      display: block;
      overflow: hidden;
      color: var(--ivory);
      font-family: Rockwell, Georgia, serif;
      font-size: clamp(16px, 1.55vw, 29px);
      font-weight: 900;
      letter-spacing: -.035em;
      line-height: 1.05;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .champion-name.pending {
      color: rgba(247, 240, 223, .45);
      font-size: clamp(12px, .9vw, 16px);
      font-family: inherit;
      font-style: italic;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: none;
    }

    .footer {
      position: relative;
      z-index: 3;
      height: var(--footer-h);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      padding: 0 clamp(28px, 3.8vw, 76px);
      border-top: 1px solid rgba(247, 240, 223, .1);
      background: rgba(2, 15, 24, .44);
      color: rgba(247, 240, 223, .48);
      font-size: clamp(8px, .62vw, 11px);
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .footer strong { color: var(--gold); font-weight: 900; }
    .footer-center { color: var(--ivory-dim); }
    .footer-right { justify-self: end; }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      opacity: .055;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    @keyframes settle {
      from { opacity: 0; transform: scale(1.06); }
      to { opacity: .56; transform: scale(1.018); }
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade-across {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .72; transform: scale(.84); }
    }

    @media (max-width: 1100px) {
      :root {
        --round-gap: 15px;
        --card-h: 68px;
      }
      .bracket-shell { padding-left: 20px; padding-right: 20px; }
      .masthead { padding-left: 24px; padding-right: 24px; }
      .team { grid-template-columns: 24px minmax(0, 1fr) 9px; gap: 5px; padding: 0 6px; }
      .match { border-left-width: 2px; }
      .seed { width: 22px; height: 22px; }
      .event-mark .cup-mark { display: none; }
      .fullscreen-button span { display: none; }
      .fullscreen-button { width: 37px; padding-inline: 0; }
    }

    @media (max-aspect-ratio: 4/3) {
      html, body { overflow: auto; }
      .stage { min-width: 1050px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="stage">

  <script>

        2: "Sarah",

        5: "Isabella",

      },

      // Use a draw number (1–10) for the winner, or null if not played yet.
      winners: {

    };

    // Bracket structure. The play-ins make a fair 10-person single-elimination draw:

    const matches = {
      PI1: { sides: [8, 9] },
      PI2: { sides: [7, 10] },
      QF1: { sides: [1, { from: "PI1" }] },
      QF2: { sides: [4, 5] },
      QF3: { sides: [3, 6] },

      SF2: { sides: [{ from: "QF3" }, { from: "QF4" }] },
      F:   { sides: [{ from: "SF1" }, { from: "SF2" }] }
    };

    const links = [
      ["PI1", "QF1"], ["PI2", "QF4"],
      ["QF1", "SF1"], ["QF2", "SF1"],
      ["QF3", "SF2"], ["QF4", "SF2"],
      ["SF1", "F"], ["SF2", "F"],
      ["F", "champion-card"]
    ];

    function entrant(side) {
      if (typeof side === "number") return { seed: side, name: tournament.players[side] || `Draw #${side}` };
      const winner = tournament.winners[side.from];
      if (winner == null) return { seed: "?", name: `Winner · ${side.from}`, placeholder: true };
      return { seed: winner, name: tournament.players[winner] || `Draw #${winner}` };
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[character]);
    }

    function renderMatch(id) {
      const element = document.getElementById(`match-${id}`);
      const winner = tournament.winners[id];
      const sides = matches[id].sides.map(entrant);

      if (winner != null) {
        element.classList.add("completed");
        element.setAttribute("aria-label", `${id} completed. ${tournament.players[winner]} won.`);
      } else {
        element.classList.remove("completed");
      }

      const teams = sides.map(player => {
        const isWinner = winner != null && player.seed === winner;
        const isEliminated = winner != null && !player.placeholder && player.seed !== winner;
        const classes = ["team", player.placeholder && "placeholder", isWinner && "winner", isEliminated && "eliminated"]
          .filter(Boolean).join(" ");
        return `
          <div class="${classes}">
            <span class="seed">${player.seed}</span>
            <span class="team-name">${escapeHTML(player.name)}</span>
            <span class="advance" aria-hidden="true">◆</span>
          </div>`;
      }).join("");

      element.innerHTML = teams + (winner != null ? '<span class="match-status">Final</span>' : '');
    }

    function validateWinners() {
      Object.entries(tournament.winners).forEach(([matchId, winner]) => {
        if (winner == null) return;
        const validSeeds = matches[matchId].sides.map(entrant).filter(p => !p.placeholder).map(p => p.seed);
        if (!validSeeds.includes(winner)) {
          console.warn(`${matchId}: Draw #${winner} is not currently in this match. Check earlier winners.`);
        }
      });
    }

    function renderChampion() {
      const winner = tournament.winners.F;
      const name = document.getElementById("champion-name");
      if (winner == null) {
        name.textContent = "Glory awaits";
        name.classList.add("pending");
        return;
      }
      name.textContent = tournament.players[winner] || `Draw #${winner}`;
      name.classList.remove("pending");
    }

    function drawConnectors() {
      const bracket = document.getElementById("bracket");
      const svg = document.getElementById("connectors");
      const frame = bracket.getBoundingClientRect();
      svg.setAttribute("viewBox", `0 0 ${frame.width} ${frame.height}`);
      svg.innerHTML = "";

      links.forEach(([sourceId, targetId]) => {
        const source = document.getElementById(sourceId === "champion-card" ? sourceId : `match-${sourceId}`);
        const target = document.getElementById(targetId === "champion-card" ? targetId : `match-${targetId}`);
        if (!source || !target) return;

        const a = source.getBoundingClientRect();
        const b = target.getBoundingClientRect();
        const x1 = a.right - frame.left;
        const y1 = a.top + a.height / 2 - frame.top;
        const x2 = b.left - frame.left;
        const y2 = b.top + b.height / 2 - frame.top;
        const mid = x1 + (x2 - x1) / 2;
        const d = `M ${x1} ${y1} H ${mid} V ${y2} H ${x2}`;

        ["connector-shadow", "connector"].forEach(className => {
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", d);
          path.setAttribute("class", className);
          svg.appendChild(path);
        });
      });
    }

    const fullscreenButton = document.getElementById("fullscreen-button");
    const fullscreenLabel = document.getElementById("fullscreen-label");

    function currentFullscreenElement() {
      return document.fullscreenElement || document.webkitFullscreenElement || null;
    }

    function updateFullscreenButton() {
      const isFullscreen = Boolean(currentFullscreenElement());
      fullscreenButton.dataset.active = String(isFullscreen);
      fullscreenLabel.textContent = isFullscreen ? "Exit full screen" : "Full screen";
      fullscreenButton.setAttribute("aria-label", isFullscreen ? "Exit fullscreen" : "Enter fullscreen");
      fullscreenButton.title = isFullscreen ? "Exit fullscreen (F or Esc)" : "Enter fullscreen (F)";
    }

    async function toggleFullscreen() {
      try {
        if (currentFullscreenElement()) {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) await exit.call(document);
        } else {
          const target = document.documentElement;
          const enter = target.requestFullscreen || target.webkitRequestFullscreen;
          if (enter) await enter.call(target);
        }
      } catch (error) {
        console.warn("Fullscreen could not be changed:", error);
      } finally {
        updateFullscreenButton();
      }
    }

    const fullscreenSupported = Boolean(
      document.fullscreenEnabled ||
      document.webkitFullscreenEnabled ||
      document.documentElement.requestFullscreen ||
      document.documentElement.webkitRequestFullscreen
    );

    if (fullscreenSupported) {
      fullscreenButton.addEventListener("click", toggleFullscreen);
      document.addEventListener("fullscreenchange", updateFullscreenButton);
      document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
      document.addEventListener("keydown", event => {
        if (event.key.toLowerCase() === "f" && !event.metaKey && !event.ctrlKey && !event.altKey) {
          event.preventDefault();
          toggleFullscreen();
        }
      });
    } else {
      fullscreenButton.disabled = true;
      fullscreenButton.title = "Fullscreen is not supported by this browser";
      fullscreenButton.setAttribute("aria-label", fullscreenButton.title);
    }

    Object.keys(matches).forEach(renderMatch);
    validateWinners();
    renderChampion();
    updateFullscreenButton();
    requestAnimationFrame(drawConnectors);
    new ResizeObserver(drawConnectors).observe(document.getElementById("bracket"));
  </script>
</body>
</html>
